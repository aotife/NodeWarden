name: Sync upstream auto
on:
  schedule:
    - cron: '0 8 * * *' # UTC 08:00 北京时间16:00每日同步
  workflow_dispatch: # 支持网页手动触发

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 删除 persist-credentials: false，保留默认true，自动携带GITHUB_TOKEN凭证

      - name: Configure Git user
        run: |
          git config --global user.name "Auto Sync Bot"
          git config --global user.email "sync-bot@github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/shuaiplus/nodewarden.git

      - name: Fetch upstream main branch
        run: git fetch upstream main

      - name: Merge upstream code
        run: git merge upstream/main --allow-unrelated-histories || true

      - name: Push merged code to your repo
        run: git push origin main
