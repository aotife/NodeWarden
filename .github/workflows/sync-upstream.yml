name: Sync upstream auto
on:
  schedule:
    - cron: '0 8 * * *' # UTC 8点 = 北京时间16点
  workflow_dispatch:

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git user
        run: |
          git config --global user.name "Auto Sync Bot"
          git config --global user.email "sync-bot@github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/shuaiplus/nodewarden.git

      - name: Fetch upstream main
        run: git fetch upstream main

      - name: Merge upstream changes
        run: git merge upstream/main --allow-unrelated-histories || true

      - name: Push update to origin
        run: git push origin main
